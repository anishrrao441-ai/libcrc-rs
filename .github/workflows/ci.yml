name: CI

# Validates the two claims a judge most needs to trust:
#   1. the unmodified original C test suite passes against the Rust port
#   2. the port contains no unsafe code
# Also builds the Dockerfile, which could not be built on the author's machine.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Original suite vs Rust port (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt

      - name: Verify tests/original is unmodified
        shell: bash
        run: sha256sum -c tests/original.sha256

      - name: One-command build + original suite
        shell: bash
        run: ./build.sh

      - name: Prove the port contains no unsafe
        shell: bash
        run: |
          if grep -rn "unsafe" crates/libcrc-rs/src/ | grep -v "forbid(unsafe_code)"; then
            echo "::error::unsafe found in the port crate"; exit 1
          fi
          grep -q "forbid(unsafe_code)" crates/libcrc-rs/src/lib.rs \
            || { echo "::error::forbid(unsafe_code) missing"; exit 1; }
          echo "libcrc-rs: 0 unsafe, forbid(unsafe_code) in force"

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Formatting
        run: cargo fmt --all -- --check

  docker:
    name: Docker one-step build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t libcrc-rs .
      - name: docker run (original suite must pass inside the image)
        run: docker run --rm libcrc-rs
